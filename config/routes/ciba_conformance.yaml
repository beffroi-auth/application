# The endpoint the OpenID conformance suite answers a backchannel request with when nobody is there to
# answer it (tests/conformance/README.md), in development only, as the endpoints of the FIDO2 server API
# and the clients of the suite are: not an API of the product. "castor conformance" points the FAPI-CIBA
# runs at "https://op.localhost/ciba/conformance/approval".
when@dev:
    heidi_ciba_conformance:
        resource: '@HeidiBundle/config/routes/ciba-conformance.php'
        prefix: /ciba/conformance
