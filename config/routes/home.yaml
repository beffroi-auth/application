# The root of this application (docs/architecture.md §5.2). The bundle never takes the root of the
# application that installs it: it serves the pages of the issuer under the path the application imports
# them at, and what "/" answers is the application's own decision. Here the issuer is the origin alone and
# its root is the account of whoever is signed in; a browser without a session is sent to the login by the
# page itself, and comes back to it.
#
# The name carries the interaction plane, which is the convention HEIDI_PLANE reads (Plane::ofRoute): a
# process that serves the protocol alone answers 404 here, as it does on every page meant for a browser.
heidi_interaction_home:
    path: /
    controller: Symfony\Bundle\FrameworkBundle\Controller\RedirectController::redirectAction
    defaults:
        route: heidi_interaction_account
        permanent: false
