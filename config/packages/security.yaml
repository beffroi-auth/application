# The firewall of the interaction pages (architecture §5.4): the users of the bundle, never a User of this
# application (decision 0002); a form login on the login page of an interaction, with the CSRF token the
# page renders; the state of the account checked after the password; the handlers that send the browser
# back to the page of its interaction. The hasher of the users of the bundle is declared by the bundle.
#
# The protocol plane (discovery, JWKS, token, UserInfo) sits outside of any firewall: nothing there reads
# a cookie or starts a session, a bearer token is checked by the endpoint itself.
security:
    providers:
        heidi:
            id: Heidi\Bundle\Security\IdentityUserProvider

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        heidi_protocol:
            pattern: ^/(\.well-known/(openid-configuration|oauth-authorization-server)|jwks|token|userinfo|introspect|revoke|par)$
            security: false
        heidi_interaction:
            lazy: true
            provider: heidi
            user_checker: Heidi\Bundle\Security\UserChecker
            form_login:
                login_path: heidi_interaction_login
                check_path: heidi_interaction_login
                username_parameter: _username
                password_parameter: _password
                enable_csrf: true
                csrf_token_id: authenticate
                success_handler: Heidi\Bundle\Security\InteractionLoginHandler
                failure_handler: Heidi\Bundle\Security\InteractionLoginHandler
            # The passkey login and the second step of a password login on the same firewall: the
            # assertion posted by the login page, the code posted by the code page, one
            # LoginSuccessListener for the three (architecture §5.4).
            custom_authenticators:
                - Heidi\Bundle\Security\PasskeyLoginAuthenticator
                - Heidi\Bundle\Security\TotpLoginAuthenticator

    # The pages decide for themselves whether a session is needed (the login page shows its form, the
    # consent page sends a browser without a session back to the login): no rule here.
    access_control: []
