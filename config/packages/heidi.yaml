# The configuration of the bundle (docs/11-architecture.md §5.1). Everything that varies by deployment is an
# environment variable; the local KMS key and the secrets of the clients below are written into .env.local by
# "castor provision" (development only, nothing secret is committed), production sets its own.
heidi:
    tenant:
        issuer: '%env(HEIDI_ISSUER)%'
    keys:
        kms: '%env(HEIDI_KMS_DSN)%'
        key_id: '%env(HEIDI_KMS_KEY_ID)%'
        storage: '%kernel.project_dir%/var/keys'
    tokens:
        authorization_code_ttl: 60
        access_token_ttl: 600
        id_token_ttl: 600
        refresh_token_ttl: 2592000
        refresh_token_absolute_ttl: 7776000
    clients: []

# The clients of spike 1, in development only: the two the OpenID conformance suite needs for each of its
# client_auth_type variants (tests/conformance/README.md; the second client of a plan is the one the suite
# uses to check the behaviour with a wrong client), and the reference client of the core, oidc-demo on
# Symfony's oidc_login, which authenticates with client_secret_post and calls back on /oidc/callback.
# A client authenticates with the one method it registered (RFC 6749 §2.3.1), hence one pair per variant.
when@dev:
    heidi:
        clients:
            conformance-basic:
                name: 'OpenID conformance suite (client_secret_basic)'
                secret: '%env(CONFORMANCE_BASIC_SECRET)%'
                redirect_uris: ['https://localhost:8443/test/a/heidi/callback']
                post_logout_redirect_uris: ['https://localhost:8443/test/a/heidi/post_logout_redirect']
                token_endpoint_auth_method: client_secret_basic
                allowed_scopes: ['openid', 'profile', 'email', 'address', 'phone', 'offline_access']
            conformance-basic-second:
                name: 'OpenID conformance suite, second client (client_secret_basic)'
                secret: '%env(CONFORMANCE_BASIC_SECOND_SECRET)%'
                redirect_uris: ['https://localhost:8443/test/a/heidi/callback']
                post_logout_redirect_uris: ['https://localhost:8443/test/a/heidi/post_logout_redirect']
                token_endpoint_auth_method: client_secret_basic
                allowed_scopes: ['openid', 'profile', 'email', 'address', 'phone', 'offline_access']
            conformance-post:
                name: 'OpenID conformance suite (client_secret_post)'
                secret: '%env(CONFORMANCE_POST_SECRET)%'
                redirect_uris: ['https://localhost:8443/test/a/heidi/callback']
                post_logout_redirect_uris: ['https://localhost:8443/test/a/heidi/post_logout_redirect']
                token_endpoint_auth_method: client_secret_post
                allowed_scopes: ['openid', 'profile', 'email', 'address', 'phone', 'offline_access']
            conformance-post-second:
                name: 'OpenID conformance suite, second client (client_secret_post)'
                secret: '%env(CONFORMANCE_POST_SECOND_SECRET)%'
                redirect_uris: ['https://localhost:8443/test/a/heidi/callback']
                post_logout_redirect_uris: ['https://localhost:8443/test/a/heidi/post_logout_redirect']
                token_endpoint_auth_method: client_secret_post
                allowed_scopes: ['openid', 'profile', 'email', 'address', 'phone', 'offline_access']
            oidc-demo:
                name: 'oidc-demo'
                secret: '%env(OIDC_DEMO_SECRET)%'
                redirect_uris: ['https://localhost:8002/oidc/callback']
                post_logout_redirect_uris: ['https://localhost:8002/']
                token_endpoint_auth_method: client_secret_post
                requires_consent: false
