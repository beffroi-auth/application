# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    #esi: true
    #fragments: true

# The second instance of oidc-demo runs on the machine that runs the stack, and the worker is what
# carries a logout token to it ("castor demo --logout-others"). curl resolves every name ending in
# ".localhost" to the loopback address of whoever asks, ignoring /etc/hosts, so from inside a
# container that is the container: the address docker wrote there for the gateway of the host is
# given to curl explicitly. BEFFROI_DEMO_HOST_IP is read from /etc/hosts by the command of the worker
# (compose.yaml) and is the loopback address everywhere else, which changes nothing.
when@dev:
    framework:
        http_client:
            default_options:
                resolve:
                    demo.localhost: '%env(BEFFROI_DEMO_HOST_IP)%'

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
