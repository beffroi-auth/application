; https://symfony.com/doc/current/performance.html#use-the-opcache-class-preloading
; The user the preloading runs as when PHP starts as root, which the image does not do on its own.
opcache.preload_user = www-data
opcache.preload = /app/config/preload.php
; https://symfony.com/doc/current/performance.html#don-t-check-php-files-timestamps
; The files of the image change with the image only. What the application writes and includes at runtime, the
; caches of Symfony and Twig, is invalidated in OPcache by whatever writes it.
opcache.validate_timestamps = 0
