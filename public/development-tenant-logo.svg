<?xml version="1.0" encoding="UTF-8"?>
<!--
  The mark of Quillfield, the organisation the development stack plays (apps/beffroi/.env.dev): an invented one,
  so that a page and a capture of that stack say who the visitor came for, and never Beffroi, whose screens
  put the organisation in front. Served from the origin of the application, which the policy of every page
  allows under 'self'; the image leaves it out (Dockerfile.dockerignore). Two tones and an accent rather than
  currentColor, an image a browser loads being a document of its own that inherits nothing from the page.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
    <rect width="64" height="64" rx="14" fill="#134e4a"/>
    <circle cx="32" cy="31" r="14" fill="none" stroke="#f0fdfa" stroke-width="7"/>
    <path d="M35 35 44 45" stroke="#fbbf24" stroke-width="7" stroke-linecap="round"/>
</svg>
